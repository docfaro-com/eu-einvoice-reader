name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Official samples are downloaded, not committed; any that cannot be fetched are skipped, not failed.
      - name: Download official sample invoices
        run: npm run fixtures
        continue-on-error: true
      - run: npm test
      - run: npm run build
      - run: npm run test:dist
      - name: Package contents
        run: npm pack --dry-run
